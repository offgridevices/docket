    - {when: baseline_present, state: 3}
    - {when: always, state: 4}
- question: EXE-13
  cites: "GAO-15-457R V.d"
  clauses:
    - {when: vv_documented, state: 1}
    - {when: reliability_some, state: 2}
    - {when: always, state: 4}
- question: EXE-14
  cites: "GAO-06-938 VI.a; GAO-11-82R VI.a; GAO-23-106549 F5"
  clauses:
