    - {when: alternatives_exist, state: 2}
    - {when: always, state: 4}
- question: PRE-7
  cites: "GAO-15-457R VIII.g; GAO-16-86"
  clauses:
    - {when: stakeholders_informed, state: 1}
    - {when: always, state: 4}
