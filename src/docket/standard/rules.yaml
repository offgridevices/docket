    - {when: claims_all_supported, state: 2}
    # docs/decisions/2026-09-05-narrative-only-records-score-state-2-on-pre-3-pre-4.md
    - {when: claims_exist, state: 2}  # R2, 2026-09-05
    - {when: always, state: 4}
- question: PRE-5
  cites: "GAO-15-457R VIII.c"
  clauses:
