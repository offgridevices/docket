# src/docket/standard/rules.yaml — scoring rules per question. First matching clause wins.
# States per GAO-11-82R: 1 no concerns · 2 some · 3 significant · 4 insufficient information.
# The GAO-23-106549 page and finding numbers cited below map that report to *our* question
# set: the mapping is ours, not GAO's. GAO-23-106549 publishes a 3×3 section×dimension
# verdict grid and nine findings, NOT per-question labels — compare to GAO on the grid and
# the findings only (design §9.1; mirrors the note on the gao-23-106549 tailoring).
- question: DES-1
  cites: "GAO-16-820 App. I 'Objectives, Scope and Methodology'"
  clauses:
    - {when: charter_complete_and_plan_approved, state: 1}
    - {when: charter_complete, state: 2}
    - {when: charter_partial, state: 3}
    - {when: always, state: 4}
- question: DES-2
  cites: "GAO-16-820 App. I; GAO-23-106549 p. 7 (objectivity q2)"
  clauses:
    - {when: charter_question_and_terms_defined, state: 1}
    - {when: charter_question_stated, state: 2}
    - {when: always, state: 4}
- question: DES-3
  cites: "GAO-16-820 App. I; GAO-23-106549 F9"
  clauses:
    - {when: scope_defined_and_terms_defined, state: 1}
    - {when: scope_defined, state: 2}
    - {when: always, state: 4}
- question: DES-4
  cites: "GAO-16-820 App. I 'Assumptions'; GAO-18-230 II.a.1"
  clauses:
    - {when: assumptions_all_have_rationale, state: 1}
    - {when: assumptions_listed, state: 2}
    - {when: always, state: 4}
- question: DES-5
  cites: "GAO-16-820 App. I 'Assumptions'; GAO-23-106549 F6"
  clauses:
    - {when: assumptions_all_evidenced_and_consistent, state: 1}
    - {when: assumptions_some_evidenced, state: 2}
    - {when: assumptions_listed, state: 3}
    - {when: always, state: 4}
- question: DES-6
  cites: "GAO-16-820 App. I 'Assumptions'; GAO-23-106549 p. 14 sensitivity credit"
  clauses:
    - {when: all_linchpins_have_flip, state: 1}
    - {when: some_linchpins_have_flip, state: 2}
    - {when: any_assumption_varied, state: 2}
    - {when: assumptions_listed, state: 3}
    - {when: always, state: 4}
- question: DES-7
  cites: "GAO-16-820 App. I 'Limitations and Constraints'"
  clauses:
    - {when: constraints_discussed, state: 1}
    - {when: constraints_listed, state: 2}
    - {when: always, state: 4}
- question: DES-8
  cites: "GAO-16-820 App. I 'Models'"
  clauses:
    - {when: scenarios_have_rationale, state: 1}
    - {when: scenarios_listed, state: 2}
    - {when: always, state: 4}
- question: DES-9
  cites: "GAO-16-820 App. I 'Models'"
  clauses:
    - {when: scenarios_cover_conditions, state: 1}
    - {when: scenarios_listed, state: 2}
    - {when: always, state: 4}
- question: DES-10
  cites: "GAO-15-457R I.c"
  clauses:
    - {when: plan_followed, state: 1}
    - {when: plan_exists, state: 3}
    - {when: always, state: 4}
- question: DES-11
  cites: "GAO-15-457R I.d"
  clauses:
    - {when: deviations_documented, state: 1}
    - {when: plan_exists, state: 3}
    - {when: always, state: 4}
- question: DES-12
  cites: "GAO-06-938 I.a"
  clauses:
    - {when: mandate_elements_covered, state: 1}
    - {when: mandate_elements_some, state: 2}
    - {when: always, state: 4}
- question: DES-13
  cites: "GAO-16-820 App. I 'Limitations and Constraints'"
  clauses:
    - {when: limitations_identified_and_mitigated, state: 1}
    - {when: limitations_some, state: 2}
    - {when: always, state: 4}
- question: DES-14
  cites: "GAO-15-457R II.d/II.g"
  clauses:
    - {when: bias_checks_performed_no_open_risks, state: 1}
    - {when: assumptions_listed, state: 2}
    - {when: always, state: 4}
- question: EXE-1
  cites: "GAO-16-820 App. I; GAO-23-106549 p. 7 (objectivity q1)"
  clauses:
    - {when: methodology_covers_objectives, state: 1}
    - {when: plan_exists, state: 2}
    - {when: always, state: 4}
- question: EXE-2
  cites: "GAO-23-106549 p. 7 (objectivity q2)"
  clauses:
