    - {when: measures_exist, state: 2}
    - {when: always, state: 4}
- question: PRE-1
  cites: "GAO-23-106549 p. 8 (validity q1)"
  clauses:
    - {when: results_support_claims, state: 1}
    - {when: runs_exist, state: 2}
    - {when: claims_all_supported, state: 2}
    - {when: always, state: 4}
- question: PRE-2
  cites: "GAO-23-106549 p. 8 (reliability q2); MIL-STD-3022 §5.3"
  clauses:
    - {when: claims_exist_no_silence_no_blocking_gaps, state: 1}
    - {when: claims_exist_no_silence, state: 2}
    - {when: always, state: 4}
- question: PRE-3
  cites: "GAO-23-106549 p. 8 (all three dimensions q3)"
  clauses:
    - {when: conclusions_sound, state: 1}
    - {when: results_support_claims, state: 2}
    - {when: runs_exist, state: 3}
    # docs/decisions/2026-09-05-narrative-only-records-score-state-2-on-pre-3-pre-4.md
    - {when: claims_exist_no_silence, state: 2}  # R2, 2026-09-05
    - {when: always, state: 4}
- question: PRE-4
  cites: "GAO-23-106549 p. 8 (objectivity q4)"
  clauses:
