    - {when: findings_present, args: {rule: ModelUsePastPurpose}, state: 3}
    - {when: model_evidence_reuse_past_purpose, state: 3}
    - {when: findings_present, args: {rule: ReaccreditationRequired}, state: 2}
    - {when: always, state: 4}
