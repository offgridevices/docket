    - {when: models_documented_some, state: 3}
    - {when: always, state: 4}
- question: EXE-9
  cites: "GAO-15-457R IV.a"
  clauses:
    - {when: plan_followed, state: 1}
    - {when: plan_exists, state: 3}
    - {when: always, state: 4}
- question: EXE-10
  cites: "GAO-15-457R V.b"
  clauses:
