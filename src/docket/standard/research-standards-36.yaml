dimension_mapping:
  source: GAO-23-106549 pp. 7-8
  objectivity:
    verbatim: An objective study should identify and account for biases. A well-designed study accomplishes
      this by clearly stating the study's objective, as well as identifying assumptions and constraints
      (as noted in questions two, four, and seven for study design in the figure above). A well-executed
      study demonstrates objectivity by addressing those objectives as stated in the design (as noted
      in questions one and two for study execution). A well-presented study contributes to objectivity
      by presenting conclusions that do not differ from the study's design and execution (as noted in
      questions three and four for study presentation).
    question_ids:
    - DES-2
    - DES-4
    - DES-7
    - EXE-1
    - EXE-2
    - PRE-3
    - PRE-4
  validity:
    verbatim: A valid study should be sound and make reasonable conclusions that are derived from the
      underlying methods and information. A well-designed study contributes to validity by using reasonable
      and consistent assumptions (as noted in question five for study design). A well-executed study ensures
      validity by carrying the methodology out as planned, or appropriately adjusting it to the evidence
      (as noted in question three for study execution). A well-presented study accomplishes this by presenting
      conclusions that are supported by the analysis conducted (as noted in questions one and three for
      study presentation).
    question_ids:
    - DES-5
    - EXE-3
    - PRE-1
    - PRE-3
  reliability:
    verbatim: A reliable study should be dependable and use complete information and data. A well-designed
      study contributes to reliability by allowing for the dependability of results through a sensitivity
      analysis (as noted in question six for study design). A well-executed study contributes to reliability
      by ensuring the data and information are sufficiently complete and reliable for the study's purposes
      (as noted in question five for study execution). A well-presented study contributes to reliability
      by not drawing conclusions from incomplete data or information (as noted in questions two and three
      for study presentation).
    question_ids:
    - DES-6
    - EXE-5
    - PRE-2
    - PRE-3
  unmapped_questions:
  - DES-1
  - DES-3
  - DES-8
  - DES-9
  - EXE-4
  - EXE-6
  - EXE-7
  - EXE-8
