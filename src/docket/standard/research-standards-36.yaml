rating_scale:
  source: GAO-11-82R, Enclosure II, p. 35 (PDF p. 35)
  levels:
  - level: 1
    label: no limitations or concerns
    verbatim: the evidence had no limitations or raised no concerns
  - level: 2
    label: some limitations or concerns
    verbatim: the evidence had some limitations or raised some concerns
  - level: 3
    label: significant limitations or concerns
    verbatim: the evidence had significant limitations or raised significant concerns
  - level: 4
    label: indeterminate — insufficient information
    verbatim: we could not determine the extent of limitations or concerns because there was not sufficient
      information
  decision_rule_verbatim: For any of the subquestions of the study process for which we determined there
    were either "some" or "significant" limitations or concerns, we concluded that these aspects of the
    study were not consistent with the relevant generally accepted research standards.
band_prompts:
  design: 'Design: Is the study well designed?'
  execution: 'Execution: Is the study well executed?'
  presentation: 'Presentation of results: Are the results timely, complete, accurate, concise, and relevant
    to the client and stakeholders?'
normative_definitions:
  objectives_scope_and_methodology:
    band: design
    page: p. 28 (PDF p. 32)
    verbatim: 'Objectives, Scope and Methodology: Objectives outline what a study is intended to accomplish.
      A study''s scope defines the subject matter that will be assessed and reported on, and the scope
      is directly tied to the audit objectives. A study''s methodology should be consistent with and address
      a study''s objectives.'
    governs:
    - DES-1
    - DES-2
    - DES-3
    - DES-10
    - DES-11
    - DES-12
    - EXE-1
  assumptions:
    band: design
    page: p. 29 (PDF p. 33)
    verbatim: 'Assumptions: Assumptions should be reasonable, consistent, appropriately varied, and explicitly
      identified in order to understand the context of the study''s results. Assumptions define the parameters
      for what will be included and how the study is executed.'
    governs:
    - DES-4
    - DES-5
    - DES-6
    - DES-14
  limitations_and_constraints:
    band: design
    page: p. 29 (PDF p. 33)
    verbatim: 'Limitations and Constraints: Limitations and constraints, which are generally found in
      studies, should be identified and reasonably mitigated. Research standards do not call for the elimination
      of all limitations, but do call for them to be identified, assessed, mitigated, and explained.'
    governs:
    - DES-7
    - DES-13
  models:
    band: execution
    page: p. 29 (PDF p. 33)
    verbatim: 'Models: Models should be reasonable ones to consider, represent a reasonably complete range
      of conditions, as well as be appropriate for the intended purpose.'
    governs:
    - DES-8
    - DES-9
    - EXE-3
    - EXE-7
    - EXE-8
  data_reliability:
    band: execution
    page: p. 30 (PDF p. 34)
    verbatim: 'Data reliability: The data used in a study should be valid for the intended research purpose;
      in other words, they represent what they purport to represent. Documenting a study''s analytical
      and decision-making process helps to ensure the accuracy, completeness, and credibility of study
      results.'
    governs:
    - EXE-4
    - EXE-5
    - EXE-6
    - EXE-11
    - EXE-12
    - EXE-13
editorial_acts:
  merges:
  - id: DES-5
    merged:
    - GAO-15-457R II.b
    - GAO-15-457R II.e
    why: The published 21 collapses "necessary and reasonable" and "common throughout the study and models"
      into one question, "Are the assumptions reasonable and consistent?"
  - id: DES-14
    merged:
    - GAO-15-457R II.d
    - GAO-15-457R II.g
    why: Both are "does the assumption set support sound, unbiased analysis"; neither survives into the
      published 21; merging them frees the slot the published 21 needs for DES-1.
    caution: This merge is OURS, not GAO's. Unmerge if a reviewer objects.
  - id: EXE-8
    merged:
    - GAO-15-457R VI.c
    - GAO-15-457R VI.d
    why: The published 21 wording "Have the models used in the study been described and documented adequately?"
      is plainly the union of "Has each model in the study been described?" and "Are the model processes
      clearly explained, documented, and understood?" GAO-16-820 performs the same merge explicitly, printing
      it as one bullet.
  - id: EXE-15
    merged:
    - GAO-15-457R VII.a
    - GAO-15-457R VII.b
    - GAO-15-457R VII.c
    why: MOE/EEA area. All three are marked "not applicable" together in GAO-15-457R and all three are
      excluded together in GAO-18-230 with a single shared rationale. They behave as one gate.
    caution: This merge is OURS, not GAO's.
  splits:
  - ids:
    - PRE-1
    - PRE-2
    split_from: GAO-15-457R VIII.b
    why: The published 21 splits "Does the report present an assessment that is well documented and conclusions
      that are supported by the analyses?" into PRE-2 (well documented) and PRE-1 (do the modeling results
      support the report findings). GAO performed this split, not us.
  band_moves:
  - id: EXE-2
    from_band: presentation
    from: GAO-15-457R VIII.a — Does the report address the objectives?
    to_band: execution
    why: 'The published 21 files "Are the study''s objectives addressed?" under EXECUTION. GAO-23-106549
      p. 7 confirms: "A well-executed study demonstrates objectivity by addressing those objectives as
      stated in the design (as noted in questions one and two for study execution)."'
    by: GAO
  exclusions_to_hold_at_36:
    note: Seven questions named in at least one source are NOT given a canonical row. All seven are mobility/threat-specific
      residue or 2018-only additions. They are listed in `residual_questions:` with full provenance. Adding
      them gives 43 distinct questions; unmerging the four merges above gives 48.
