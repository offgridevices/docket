# Two blocks, and the split between them is the whole point of this file.
#
#   `transcribed:`  GAO's own words and GAO's own attribution of a finding to a section,
#                   checked against sources/gao-23-106549.pdf page by page. Nothing in
#                   this block is our reading.
#   `ours:`         everything this project added: the count of nine, the kernel rule or
#                   rating we expect to detect each finding, the object ids it should
#                   fire on, the cross-fires we expect, the translation of GAO's verdict
#                   words into the kernel's enum, and the glosses under each quotation.
#
# An earlier version of this file said "Nothing in this file is our reading" on line 1.
# That was false of `mechanism`, `object_hint` and `expected_cross_fires`, which is why
# the two blocks exist.
source: "GAO-23-106549, printed pp. 8-14 (PDF pp. 11-17); Appendix I, printed p. 17 (PDF p. 20); Agency Comments, printed p. 14 (PDF p. 17)."

transcribed:
  # GAO publishes three section headings and, under each, an Objectivity / Validity /
  # Reliability paragraph (printed pp. 8-14). Arranging those nine verdicts as a 3x3 grid
  # is OURS; the nine verdicts themselves are GAO's. Figure 3 (printed p. 7) is the
  # standards figure, not a verdict grid.
  grid:
    dc: {objectivity: GO, validity: CNC, reliability: CNC}   # printed pp. 8-10
    fs: {objectivity: GO, validity: CNC, reliability: CNC}   # printed pp. 10-12
    ce: {objectivity: GO, validity: CNC, reliability: CNC}   # printed pp. 13-14

  quotations:
    scope_limit: >
      GAO-23-106549 footnote 7, printed p. 9: "We did not independently assess or verify
      the analytical efforts supporting the report." Appendix I, printed p. 17, says the
      same. Printed p. 14: "The Army told us that they had no comments on the draft
      report."
    sensitivity_credit: >
      GAO-23-106549 printed p. 14: "The report varies assumptions for each of the
      vehicles across some of the desired characteristics. Varying such assumptions
      provides a form of sensitivity analysis, which can provide increased reliability in
      results. For example, each OMFV concept presents different assumptions for some of
      its characteristics, such as engines with varying power or variance in the number
      of infantry soldiers it can transport."
    aggregation_rule: >
      GAO-23-106549 Appendix I, printed p. 17: "we drew conclusions that the report was
      generally objective when available information presented in the report was
      consistent with our definition of objectivity but was missing information that
      would have addressed the generally accepted research standards".

  findings:
    F1:
      attributed_to: [fs]
      page: "printed p. 12"
      gao_basis: >
        "According to Army officials, these analyses were not designed to draw conclusions
        on force structure alternatives. Instead, the analyses were intended to assess the
        desired characteristics, indicating that they may not be appropriate to support
        conclusions on force structure and operational concepts."
    F2:
      attributed_to: [fs]
      page: "printed p. 11"
      gao_basis: >
        "Army officials told us that a second TRAC study expanded on the first, and added
        another scenario with different terrain and details from a vendor's concepts. The
        Army report did not include any observations on force structure or operational
        concepts from this analysis or describe why the analysis was not included." The
        omission is the REPORT's: officials did give a reason in interview - "observations
        from this study were not included due to security concerns".
    F3:
      attributed_to: [ce]
      page: "printed p. 13"
      gao_basis: >
        "While these studies are used to support the comparison, the report does not,
        however, describe how the Army chose the three studies it presented."
    F4:
      attributed_to: [ce]
      page: "printed p. 14"
      gao_basis: >
        "Army officials told us, however, that they had quantitative metrics for each of
        these characteristics and used them in support of the report. The officials stated
        that they did not include these metrics in the report due to security concerns."
    F5:
      attributed_to: [dc, fs, ce]
      page: "printed p. 10"
      gao_basis: >
        "Army officials told us that the models and simulations informing the 11 analytical
        efforts had gone through the Army's standard verification, validation, and
        accreditation process to ensure their reliability."
    F6:
      attributed_to: [dc]
      page: "printed p. 9"
      gao_basis: >
        "the report assumes that bridges in Poland are representative of those across
        Eastern Europe, but the Army does not identify the data and methods used to support
        this assumption."
    F7:
      attributed_to: [dc, fs, ce]
      page: "printed pp. 9-10"
      gao_basis: >
        "the Army report did not clearly describe the methodology of these efforts ... or
        the verification, validation, and accreditation of the models and simulations it
        used."
    F8:
      attributed_to: [dc, fs, ce]
      page: "printed p. 9"
      gao_basis: >
        "the Army report did not clearly describe ... the steps it took to ensure data
        reliability".
    F9:
      attributed_to: [fs]
      page: "printed p. 10"
      gao_basis: >
        "The Army's report did not clearly define, however, force structure or operational
        concepts."

ours:
  enumeration: >
    GAO numbers nothing. It writes nine distinct criticisms across pp. 9-14 in prose, and
    cutting them into nine labelled findings F1-F9 is OUR enumeration. So is arranging
    GAO's nine section-by-dimension verdicts into a 3x3 grid. A reader who counted eight
    or ten would not be contradicting GAO.

  what_gao_published: >
    Nine section-by-dimension verdicts in prose and nine findings. GAO published NO
    per-question labels for this report. Any per-question reading of it is OURS and is
    labelled as such here, in src/docket/standard/tailorings/gao-23-106549.yaml and in
    src/docket/standard/rules.yaml.

  # GAO's verdict words, mapped onto the kernel's enum. The mapping is ours; the words on
  # either side of it are not.
  verdict_map: {GO: generally_objective, CNC: insufficient_to_conclude}

  glosses:
    scope_limit: >
      Every one of F1-F9 is therefore a REPRESENTATION failure, not an analysis failure.
      Nothing in this demonstration says the Army's analysis was wrong, because GAO does
      not say that, and GAO made no recommendations.
    sensitivity_credit: >
      Reproduced: DES-6 rates 2 on the combat-effectiveness section. Do not claim the
      Army lacked a sensitivity analysis.

  # The kernel mechanism we expect to detect each finding, and the objects it should name.
  # `rule` is a named kernel rule; `rating` is a per-question state, which is not a rule
  # at all - F7 and F8 are detected by EXE-8 and EXE-5 reaching state 4, and the README
  # and the generated report say so rather than calling them rules.
  findings:
    F1:
      rule: ReusePastPurpose
      also: "EXE-3 state 3 via model_evidence_reuse_past_purpose"
      object_hint: [ev-trac-aoa, ev-mbl-1]
    F2:
      rule: silent-omission
      object_hint: [ev-trac-oe]
    F3:
      rule: inclusion-reason-missing
      also: "Risk kind bias-selection"
      object_hint: [ev-bradley-swapc-2018, ev-market-research-study-2020, ev-concept-design-2021]
    F4:
      rule: NotAssessableAtLevel
      object_hint: [ev-ce-metrics]
    F5:
      rule: vva-verbal
      also: "EXE-14 state 3 under published-21-plus-vva"
      object_hint: [vva-aries, vva-trac]
    F6:
      rule: linchpin-unevidenced
      object_hint: [as-poland-bridges]
    F7:
      rating: {question: EXE-8, state: 4}
      object_hint: [gap-model-docs]
    F8:
      rating: {question: EXE-5, state: 4}
      object_hint: [gap-reliability-steps]
    F9:
      rule: definition-missing
      object_hint: [ch-omfv]

  expected_cross_fires:
    note: >
      Ruling R7. The three sub-episodes are three sections of ONE report: they share one
      Charter and one evidence register, exactly as the Army's report does. Some findings
      therefore fire on sections GAO did not attribute them to. These are recorded, not
      suppressed, and out/findings_matrix.json prints them next to the detections. The
      list below is what fires under OUR attribution rule; the difference against the
      kernel's own scoping is measured on every run and printed as
      `cross_fires_suppressed_by_our_attribution`.
    definition-missing: [dc, ce]        # GAO attributes F9 to the force-structure section only
    silent-omission: [dc, ce]           # ev-trac-oe sits in the shared register
    linchpin-unevidenced: [fs, ce]      # as-poland-bridges sits in the shared assumption list
    earlier_episodes: >
      Episodes 1-5 have no claims at all, so every entry in their evidence register is an
      uncited omission and silent-omission fires on each. That is the rule working as
      designed on a record that has not yet drawn conclusions;
      out/findings_matrix.json reports the per-episode count with this reason.
