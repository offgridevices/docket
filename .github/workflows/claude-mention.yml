name: Claude Mention

# Answers when someone writes `@claude` in a pull-request comment, a review comment or
# an issue. Ask it anything about the change: why a check failed, whether a claim is
# sourced, what a function does, whether a test actually covers the case.
#
# Uses the same CLAUDE_CODE_OAUTH_TOKEN secret as the review workflow.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # One answer per thread at a time. Two mentions in quick succession queue rather
  # than race, and unlike the review workflow the earlier one is not cancelled —
  # a question asked is a question worth answering.
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Two guards, both load-bearing:
    #   1. the text must actually mention @claude, or every comment starts a paid run;
    #   2. the author must be the owner or a member of the organisation, so an outside
    #      commenter cannot make this repository's token do work on their behalf.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER'
      )
    # Blacksmith 2 vCPU, for the free-plan allowance — see the note in ci.yml.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so it can read why a CI run failed when asked
    steps:
      # Pinned to commits, not tags: this job holds `id-token: write`, and a mutable
      # tag would decide what runs with it in scope.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same environment as the reviewer, so "does that test actually pass?" is a
      # question it can answer by running it rather than by reading and guessing.
      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync the project
        run: uv sync --frozen

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `track_progress` — see the note in claude-pr-review.yml.
          prompt: |
            REPO: ${{ github.repository }}

            Someone mentioned you in a comment on this repository and is asking you a
            question. Answer it.

            `docket` is Docket: software that keeps the reasoning behind an engineering
            or acquisition decision as a typed, checkable record — a governed AI agent
            drafts, a deterministic kernel computes, a human approves. Read `README.md`,
            `CONTRIBUTING.md` and `docs/architecture.md` for the rules and the layout.
            There is no `CLAUDE.md` in the repository — it is local, gitignored guidance.

            **Answer the question that was actually asked.** Do not review the whole pull
            request unless asked to; the review workflow already does that on every push.
            If the question is vague, answer the most useful reading of it and say which
            reading you took.

            **Check before you answer.** The whole repository is checked out and the
            project is installed. You can:
            - read any file, and use `git log`/`git blame` to see why a line is the way
              it is;
            - read CI results with `gh run view` and `gh run list`, including logs from a
              failed run, when asked why something failed;
            - run a targeted test with `uv run pytest -q <path>` to establish whether
              something actually passes, rather than reasoning about it;
            - run `uv run python -m reports.generate` and `git diff --stat` to check
              whether a validation number still holds;
            - run `pdftotext` over a document in `sources/` to check its own pages for
              CUI, FOUO or distribution markings.

            Prefer running the check to speculating. If you did run something, say what
            you ran and what it returned.

            **If you are asked to test something, you have a sandbox.** This runner is a
            throwaway checkout: you can write probe test files (Write/Edit) and run them
            with `uv run pytest -q <path>`, then report the input and the real output.
            Nothing you write is committed or pushed; it disappears with the runner.

            **Be honest about limits.** If you cannot verify something from the
            repository — a release status that needs a human eye, a page count that needs
            a rendered PDF, anything that depends on a decision only Shreyash can make —
            say so plainly instead of producing a confident guess. The honesty rules in
            `CONTRIBUTING.md` apply to your answers as much as to the docs.

            Reply with `gh pr comment` on a pull request, or `gh issue comment` on an
            issue. One comment, answering the question. Do not push commits, and edit files
            only to write throwaway probe tests — if asked for a change, make it locally
            to prove it passes, then reply with the exact change for a human to apply.

          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh issue comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*),Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(pdftotext:*),Bash(uv run pytest:*),Bash(uv run python:*),Bash(uv run ruff:*),Write,Edit"
            --max-turns 120
            --model claude-opus-5-5
            --effort medium
