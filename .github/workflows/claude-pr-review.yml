name: Claude PR Review

# Every pull request goes through two stages, in this order:
#
#   1. `ci`     — the full suite from ci.yml (ruff, pytest, citations, DoW lint,
#                 secrets audit, determinism gate, UI build + Playwright smoke),
#                 called directly as a reusable workflow.
#   2. `review` — Claude reads the diff, the codebase and the CI output, may run
#                 targeted checks and write throwaway probe tests in its own
#                 checkout, and leaves inline comments on the diff.
#
# `review` has `needs: ci`, so a red suite stops the pull request at stage 1 and no
# paid review runs. Fix it (by hand or with an agent), push, and both stages run again
# on the new commit. This replaces a step that polled the check-runs API for up to
# twenty minutes waiting for ci.yml: `needs:` waits for free, and the reviewer no
# longer has to be told a verdict — reaching it at all means CI passed.
#
# Requires one repository secret, CLAUDE_CODE_OAUTH_TOKEN. See the Setup note at the
# bottom of this file.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  review:
    needs: ci
    # Secrets are not available to pull_request runs from forks, and — more importantly
    # now that this job can execute repository code — a fork PR must never reach the
    # test step. Both reasons point the same way: skip rather than fail. Drafts get CI
    # but no review until marked ready (`ready_for_review` re-runs both stages), and
    # Dependabot bumps never start a paid review.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Blacksmith 2 vCPU: the organisation is on Blacksmith's free plan (3,000 2-vCPU
    # minutes a month; a 4-vCPU minute counts double). See the note in ci.yml.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # CI no longer runs inside this job's clock — it is the `ci` job above. The reviews
    # that have run took 19 to 23 minutes on GitHub's runner; 35 leaves room for a
    # thorough one without letting a hung run sit on the 6-hour default. Billing is by
    # minutes used, not by the cap.
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      # Required: the action mints its GitHub token by exchanging an OIDC token, so
      # without this it fails before reading a line ("Could not fetch an OIDC token").
      # Removing it on the theory that a reviewer only needs to comment is the mistake
      # that broke an earlier version of this file in a sibling repository.
      id-token: write
      actions: read # read CI run logs for this same commit
    steps:
      # Pinned to a commit rather than a tag: this job holds `id-token: write` and
      # `pull-requests: write`, and whoever controls a mutable tag controls what runs
      # with those in scope. `actions/checkout` v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }} # the exact commit CI passed
          fetch-depth: 0 # full history: `git log`/`git blame` make the review sharper

      # ---- Refuse to look reviewed when we cannot review ------------------------
      # GitHub will not let a pull request run a modified copy of the very workflow
      # that holds this repository's secret — otherwise any PR could rewrite this
      # file to print the token. The action honours that by skipping, and it skips
      # *quietly*: it exits 0 in about five seconds having posted nothing, so the
      # check goes green and the pull request looks reviewed when nothing read it.
      # That is exactly how #2 merged unreviewed. Catch it here, before any minutes go
      # on a review that can never run, and say so out loud — on the pull request and
      # in a red check.
      - name: Can the reviewer actually run on this PR?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}
          SELF: .github/workflows/claude-pr-review.yml
        run: |
          set -uo pipefail
          # Three outcomes, not two, because "the API did not answer" is not the same
          # as "the file differs" and must not be reported as if it were. A blip that
          # left the comparison copy empty would otherwise post a confident and wrong
          # explanation on the pull request.
          state=""
          for _ in 1 2 3; do
            if err=$(gh api "repos/$REPO/contents/$SELF?ref=$DEFAULT_BRANCH" \
                       -H "Accept: application/vnd.github.raw" \
                       2>&1 >/tmp/default-branch-copy.yml); then
              state=fetched; break
            fi
            # A 404 is a real answer: the file is not on the default branch yet, which
            # is the first-time-adding case and counts as drift.
            case "$err" in *"Not Found"*|*"404"*) state=absent; break ;; esac
            sleep 5
          done
          if [ -z "$state" ]; then
            echo "::error::Could not read $SELF from $DEFAULT_BRANCH after three attempts, so whether the reviewer can run here is unknown. Failing rather than guessing — a green check must never mean \"we could not tell\". Re-run this job."
            exit 1
          fi
          if [ "$state" = fetched ] && diff -q /tmp/default-branch-copy.yml "$SELF" >/dev/null 2>&1; then
            echo "This workflow matches $DEFAULT_BRANCH. The reviewer can run."
            exit 0
          fi
          # One comment per pull request, not one per push: the marker makes the
          # check idempotent across the synchronize events a branch normally gets.
          marker="<!-- reviewer-disabled-workflow-drift -->"
          if ! gh api "repos/$REPO/issues/$PR/comments" --jq '.[].body' 2>/dev/null \
               | grep -qF "$marker"; then
            gh pr comment "$PR" --body "$marker
          **The automated reviewer cannot run on this pull request, so nothing here has been machine-reviewed.**

          This branch changes \`$SELF\`, and GitHub refuses to run a workflow holding repository secrets from a version that does not match \`$DEFAULT_BRANCH\`. Without that rule a pull request could rewrite this file to leak the token. The reviewer is not broken and this is not a failure of the change — it is the security boundary working.

          What this means in practice:

          - This pull request needs a **human review**. The red \`review\` check is that request, not a defect in the code.
          - Once it merges, \`$DEFAULT_BRANCH\` carries the new workflow and every later pull request is reviewed normally again.
          - If you want the reviewer's eyes on the *content* here, split the workflow change into its own pull request and rebase this one on top of it after that merges.

          The check is failing on purpose. A green check has to mean \"a reviewer read this\"; before this guard existed, it meant nothing at all." || true
          fi
          echo "::error::Reviewer skipped: $SELF differs from $DEFAULT_BRANCH, so the Claude action will refuse to run. This PR needs a human review — see the comment posted on it."
          exit 1

      # ---- The environment the reviewer needs to check things for itself ------
      # Three earlier reviews each ended with "could not verify from the repository
      # alone": it could not read a PDF's text layer to check for control markings, and
      # it could not regenerate the validation report to confirm the numbers still hold.
      # Both are now possible. poppler-utils supplies pdftotext; uv supplies the project.
      - name: Install poppler (pdftotext) for release-status scans
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Pinned for the same reason as checkout. setup-uv v10 disables its cache by
      # default on pull_request events; `enable-cache: true` keeps the old behaviour.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync the project
        run: uv sync --frozen

      # Snapshot how much the reviewer has already said on this pull request, so the
      # step after the action can tell "reviewed and found nothing" apart from "never
      # ran". Those two look identical from outside and only one of them is fine.
      - name: Count the reviewer's comments before it runs
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Returns non-zero if either call fails, so a broken API is never silently
          # counted as zero comments. Both this step and the one after it use it.
          count_reviewer_comments() {
            local issue pr
            issue=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                      --jq '.[] | select(.user.login == "claude[bot]") | .id') || return 1
            pr=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
                   --jq '.[] | select(.user.login == "claude[bot]") | .id') || return 1
            echo $(( $(printf '%s\n' "$issue" | grep -c . || true) \
                   + $(printf '%s\n' "$pr"    | grep -c . || true) ))
          }
          if ! n=$(count_reviewer_comments); then
            echo "::error::Could not count the reviewer's existing comments, so there is no baseline to judge this run against. Failing rather than guessing. Re-run this job."
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "claude[bot] comments before this run: $n"

      # `anthropics/claude-code-action` v1.0.233 (Claude Code 2.1.281), pinned to a
      # commit for the same reason as checkout. Re-resolve the tag and update this line
      # deliberately when picking up a new version.
      # Claude's own `gh` runs on the Claude app's token, which cannot read
      # check results ("Resource not accessible by integration"). This step
      # reads them with this job's token instead and leaves them in
      # `.ci-results/` for Claude to Read. Untracked, never committed.
      - name: Collect CI results for Claude
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The `ci` job ran earlier in this same workflow run.
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .ci-results
          : > .ci-results/summary.md
          if [ -z "$RUN_ID" ]; then
            echo "No CI run was found for this commit." >> .ci-results/summary.md
            exit 0
          fi
          echo "# CI results (run $RUN_ID)" >> .ci-results/summary.md
          echo >> .ci-results/summary.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name | startswith("ci /")) | [.id, .name, .conclusion // .status] | @tsv' |
          while IFS=$'\t' read -r id name result; do
            file=".ci-results/$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_').log"
            # Job logs come back as a redirect to a blob; curl follows it. The
            # sed strips timestamps and terminal colour codes.
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" |
              sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g' > "$file" ||
              echo "(log not available)" > "$file"
            echo "- **$name**: $result. Full log: \`$file\`" >> .ci-results/summary.md
          done
          cat .ci-results/summary.md

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NO `track_progress`. It was tried and the action exited in two seconds
          # having posted nothing at all — a silent no-op review that reported success.
          # The configuration that reviewed four rounds on #1 did not set it, so this
          # does not either. Revisit only with a run that proves it works.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## CI has already passed on this exact commit

            **CI verdict: passed.** This review only starts when every CI job is green —
            a red suite stops the pull request before you are ever invoked.

            CI ran `check` (ruff, pytest, citations, DoW lint, secrets, and the
            byte-identical determinism gate) and `ui` (npm build + Playwright smoke).
            State the verdict in your summary. The jobs' results and full logs are in
            `.ci-results/` (start with `summary.md`); read them for warnings and
            skipped tests rather than re-running anything.

            **Do not re-run the full test suite, the whole linter, Playwright, or the
            determinism gate.** CI just did, on this commit, and repeating it wastes
            minutes and tells you nothing new. Treat the suite as green — and remember
            that green means the existing tests pass, not that the change is right.

            ## Check the pull request's description against the diff

            Run `gh pr view` and read the description. Every change in the diff should be
            something the description asks for, and everything the description claims
            should be in the diff. Unrelated changes riding along, or a claimed fix that
            is not there, are findings.

            What CI cannot do is judge whether the tests that exist are the *right*
            tests, or whether a claim in prose is true. That is your job, and these
            targeted checks are yours to run when the diff calls for them:

            - `pdftotext` on any newly added PDF, to check its own pages for CUI, FOUO,
              NOFORN or distribution markings rather than trusting its sidecar.
            - `uv run python -m reports.generate` then `git diff --stat`, when a change
              could move a validation number, to confirm the committed report still
              regenerates identically.
            - `uv run pytest -q <one path>` for a single file when you suspect a specific
              behaviour is untested or wrongly tested. One targeted run, not the suite.
            - `uv run python scripts/check-citations.py <path>` on a changed document.

            **You have a sandbox — use it to test, not just read.** This runner is a
            throwaway checkout of this commit with the project installed. You may write
            new, throwaway test files (Write/Edit) to probe the edge cases this change
            should handle — empty or malformed input, boundary values, a missing source
            file, a record that should fail verification — and run them with
            `uv run pytest -q <that file>`. Nothing you write is committed or pushed; it
            disappears with the runner. When a probe finds a real problem, put the
            failing input and the output in your comment.

            ## What this repository is

            `docket` is Docket: software that keeps the reasoning behind an engineering
            or acquisition decision as a typed, checkable record. A governed AI agent
            drafts, a deterministic kernel computes, and a human approves at each gate.
            The repository holds the code, the demonstrations built on public GAO, CBO
            and Army documents, and the documentation. Both halves matter: prose claims
            that outrun their evidence, and code that silently stops being deterministic.

            Read `README.md`, `CONTRIBUTING.md` and `docs/architecture.md` first — they
            are the authority, and `CONTRIBUTING.md` carries the numbered rules of the
            road. There is no `CLAUDE.md` in the repository: it is local working guidance
            and is gitignored, so do not look for it or cite it.

            **Read the codebase, not just the diff.** The whole repository is checked
            out. A diff read alone cannot tell you whether a changed function has other
            callers, whether an existing test already covers a case, or whether the
            change contradicts a decision already recorded in `docs/decisions/`. Go and
            look before commenting.

            ## Review against these, in priority order

            ### 1. Release status — the one that ends the effort if we get it wrong
            Nothing controlled, CUI, export-restricted, classified or unreleased may
            enter this repository, ever. For any newly added document, run `pdftotext`
            over it yourself and say what you found. If release status is unclear the
            correct outcome is a stub in `sources/` with the URL, not the file. Every
            file in `sources/` must have a `.source.md` sidecar recording URL, retrieval
            date and an explicit release check.

            ### 2. Every claim cites a committed file
            If we cannot point at the document, we do not write the sentence. Flag
            assertions of fact — dates, figures, page counts, what GAO or the Army said —
            that do not trace to a file in `sources/` or an artefact under `demos/*/out`
            or `reports/`. A citation to a *derived* artefact where the real source is a
            document one hop away does not satisfy this; that exact defect was found and
            fixed in this repository's own history.

            ### 3. Claims that must stay honest
            - GAO-23-106549 did **not** assess or verify the Army's underlying analytical
              work (footnote 7, Appendix I). Every finding is a *representation* failure.
              The Army had no comments and GAO made no recommendations. Text implying GAO
              found the analysis wrong is a defect.
            - Do **not** claim the Army's report lacked sensitivity analysis. GAO credited
              the combat-effectiveness section for varying assumptions. Partially present,
              not missing.
            - GAO publishes nine verdicts in prose; arranging them as a 3×3 grid is ours,
              and any per-question reading of that report is ours and must be labelled so.
            - The demo reconstructs the *package*, not the *analysis*: the underlying
              metrics are classified. Flag text promising reproduction of Army numbers.
            - Demo B carries no evaluation run and must never be presented as evidence
              that the numeric path works.

            ### 4. Architectural facts that are settled — flag contradictions
            - The agent never sits in the numeric path. A deterministic kernel computes.
            - The human approval gate sits on the model, not the answer — after
              elicitation, before any computation.
            - Actors are classified by their id: an id beginning `agent:` is an agent
              whatever the accompanying dict declares.
            - Model-agnostic: no provider, model or hosting commitment in the docs,
              and no PRC-origin model named anywhere.
            - The record is append-only and hash-chained, so it is tamper-**evident**,
              not tamper-proof; the chain is unkeyed in Phase I. Flag stronger wording.

            ### 5. Decisions that are settled — do not flag as open, and flag text that reopens them
            - **Licence:** AGPL-3.0-only for the application; Apache-2.0 for the record
              format (`src/docket/schema/`), the exporters (`src/docket/exports/`), the
              HTTP API description (`/api/openapi.json`) and the research-standard data,
              per `LICENSING.md`. Copyright OffGrid LLC. Contributions are inbound =
              outbound. Flag text that contradicts `LICENSING.md`, and any change to the
              licence split without a new decision record.
            - Every settled technical choice is recorded under `docs/decisions/`; text or
              code that contradicts one without a new decision record is a defect.
            - Do not conflate CUI with classified — they carry very different
              consequences.

            ### 6. Sourcing discipline, secrets, conventions
            - Flag keys, tokens, credentials, `.env*` and high-entropy strings anywhere.
            - A change of direction needs a record in `docs/decisions/` saying what was
              chosen and what would reverse it.
            - `sources/` holds the government's words verbatim; `docs/research/` is our
              analysis. Flag our analysis presented as the government's words.

            ### 7. The tests themselves
            Do not accept green CI as proof the work is right. Ask whether the tests
            assert what they claim: a test that pins an implementation detail, a
            disjunctive assertion that passes for the wrong reason, or a behaviour with
            no coverage at all are all defects worth a comment. This repository has been
            bitten by a disjunctive assertion hiding a real regression.

            ## How to report

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for anything anchored to a line. Each comment becomes a
            conversation to resolve, so make it actionable: state the defect and what
            would fix it. No "consider" or "looks good" comments.

            Then post one summary comment for THIS run with `gh pr comment` — on every
            run, even when your earlier summaries are already on the thread; the guard
            step below fails the check if this run posts nothing. Name the commit you
            reviewed in the first line. The comment contains:
            - A one-line verdict.
            - **The CI verdict, stated explicitly.**
            - What you checked by running something, and what you found.
            - Anything you could not verify, named, so a human checks it.

            If the diff is clean, or nothing changed since your last summary, still post
            the summary saying exactly that.

            Do not push commits, do not edit the pull request's own files except to write
            throwaway probe tests as above, and do not approve or request changes as a
            formal review. Comments only.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh run list:*),Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(pdftotext:*),Bash(uv run pytest:*),Bash(uv run python:*),Bash(uv run ruff:*),Write,Edit"
            --max-turns 150
            --model claude-opus-5-5
            --effort medium

      # ---- A green check must mean a reviewer read this -------------------------
      # The action exits 0 whatever happens, including when it does nothing at all:
      # a skip, an expired token, an exhausted usage limit and a clean review are
      # indistinguishable from the outside. Two pull requests here were merged
      # looking reviewed because of that. The prompt above requires a summary comment
      # even when the diff is clean, so "nothing new posted" is never a legitimate
      # outcome — treat it as the reviewer having failed, and go red.
      # No `if: always()`. If the drift guard above already failed, this step must not
      # run: its baseline would be unset, it would compare against zero, count the
      # comments an *earlier* run left, and cheerfully report a review that never
      # happened. The default — run only when every previous step passed — is the
      # correct condition, and the action's own exit code is always zero anyway.
      - name: Did the reviewer actually say anything?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -uo pipefail
          count_reviewer_comments() {
            local issue pr
            issue=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                      --jq '.[] | select(.user.login == "claude[bot]") | .id') || return 1
            pr=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
                   --jq '.[] | select(.user.login == "claude[bot]") | .id') || return 1
            echo $(( $(printf '%s\n' "$issue" | grep -c . || true) \
                   + $(printf '%s\n' "$pr"    | grep -c . || true) ))
          }
          if ! after=$(count_reviewer_comments); then
            echo "::error::Could not count the reviewer's comments after the run, so whether it posted anything is unknown. Failing rather than crediting a review that may not have happened. Re-run this job."
            exit 1
          fi
          echo "claude[bot] comments: ${BEFORE:-0} before, $after after."
          if [ "$after" -gt "${BEFORE:-0}" ]; then
            echo "The reviewer posted $(( after - ${BEFORE:-0} )) comment(s). Green means reviewed."
            exit 0
          fi
          echo "::error::The reviewer ran but posted nothing, so this pull request has NOT been reviewed. Check this job's \"Run Claude Code Action\" log for the reason — a workflow-validation skip, an expired CLAUDE_CODE_OAUTH_TOKEN and an exhausted usage limit all look like this. Do not merge on the strength of a green review check until it posts."
          exit 1

# ---- Setup (one time) -------------------------------------------------------
# 1. Repository secret named exactly:  CLAUDE_CODE_OAUTH_TOKEN
#    Generate with `claude setup-token`, then Settings -> Secrets and variables ->
#    Actions -> New repository secret. Bills through the Claude subscription.
# 2. Making comments *block* the merge needs "Require conversation resolution before
#    merging", which is branch protection. That is not available on a private
#    repository in a free organisation — both the branch-protection and the rulesets
#    APIs return 403 here. Until the organisation is on GitHub Team, resolving every
#    comment before merging is a convention this repository follows, not a rule GitHub
#    enforces. Everything else in this file works on the free plan.
