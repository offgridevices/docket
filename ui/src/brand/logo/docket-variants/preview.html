<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docket icon variants</title>
  <style>
    :root {
      --og-pitch: #1B1813;
      --og-bone: #F1ECE0;
      --og-ground: #F7F4EC;
      --og-ink: #1B1813;
      --og-ink-2: #5C554A;
      --og-ember: #FF6A00;
      --og-hairline: rgba(27, 24, 19, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--og-ground);
      color: var(--og-ink);
      padding: clamp(20px, 6vw, 80px);
      line-height: 1.5;
    }
    h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--og-ink-2);
      font-size: 16px;
      max-width: 65ch;
      margin-bottom: 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: 32px;
    }
    .card {
      border: 1px solid var(--og-hairline);
      background: #FBF9F3;
      padding: 24px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .card p {
      font-size: 13px;
      color: var(--og-ink-2);
      margin-bottom: 16px;
      min-height: 3.2em;
    }
    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .sizes svg { display: block; }
    .size-wrap { display: flex; flex-direction: column; align-items: center; }
    .size-label {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--og-ink-2);
      margin-top: 4px;
    }
    .context-row {
      margin-top: 48px;
      padding-top: 48px;
      border-top: 1px solid var(--og-hairline);
    }
    .context-row h2 { font-size: 21px; font-weight: 400; margin-bottom: 24px; }
    .header-mock {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: var(--og-ground);
      border: 1px solid var(--og-hairline);
      margin-bottom: 12px;
    }
    .header-mock .title {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.04em;
    }
    .header-mock .meta {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--og-ink-2);
    }
    .icon-128 { width: 128px; height: 128px; }
    .icon-48 { width: 48px; height: 48px; }
    .icon-24 { width: 24px; height: 24px; }
    .icon-16 { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <h1>Docket icon variants</h1>
  <p class="subtitle">
    Open this file directly in any browser. No server needed.
    Double-click preview.html in Finder, or drag it into a browser window.
  </p>

  <div class="grid" id="variants"></div>

  <div class="context-row">
    <h2>In context</h2>
    <div id="context"></div>
  </div>

  <script>
    const icons = {
      '01-bracket-mark': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="44" y="44" width="48" height="16" fill="#FF6A00"/><rect x="44" y="44" width="16" height="48" fill="#FF6A00"/><rect x="108" y="44" width="48" height="16" fill="#FF6A00"/><rect x="140" y="44" width="16" height="48" fill="#FF6A00"/><rect x="44" y="140" width="48" height="16" fill="#FF6A00"/><rect x="44" y="108" width="16" height="48" fill="#FF6A00"/><rect x="108" y="140" width="48" height="16" fill="#FF6A00"/><rect x="140" y="108" width="16" height="48" fill="#FF6A00"/><rect x="76" y="76" width="48" height="48" fill="#F1ECE0"/></svg>`,
      '02-three-marks': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><polygon points="50,100 72,78 94,100 72,122" fill="none" stroke="#F1ECE0" stroke-width="5" stroke-dasharray="10 7" opacity="0.65"/><rect x="84" y="78" width="44" height="44" fill="#F1ECE0"/><rect x="130" y="78" width="32" height="10" fill="#FF6A00"/><rect x="130" y="78" width="10" height="32" fill="#FF6A00"/><rect x="152" y="112" width="32" height="10" fill="#FF6A00"/><rect x="174" y="90" width="10" height="32" fill="#FF6A00"/></svg>`,
      '03-docket-tab': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><path d="M 52 48 H 104 V 64 H 148 V 152 H 52 Z" fill="#F1ECE0"/><rect x="60" y="56" width="36" height="8" fill="#FF6A00"/></svg>`,
      '04-human-gate': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="40" y="40" width="120" height="96" fill="#F1ECE0"/><rect x="40" y="140" width="120" height="32" fill="#FF6A00"/></svg>`,
      '05-beacon-square': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><path d="M124.5 55.4 A58 58 0 1 1 75.5 55.4" fill="none" stroke="#FF6A00" stroke-width="20" stroke-linecap="butt"/><rect x="84" y="24" width="32" height="32" fill="#F1ECE0"/></svg>`,
      '06-spine': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="48" y="36" width="32" height="128" fill="#FF6A00"/><rect x="88" y="44" width="64" height="112" fill="#F1ECE0"/></svg>`,
      '07-survey-frame': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="48" y="56" width="40" height="14" fill="#FF6A00"/><rect x="48" y="56" width="14" height="88" fill="#FF6A00"/><rect x="48" y="130" width="40" height="14" fill="#FF6A00"/><rect x="112" y="56" width="40" height="14" fill="#FF6A00"/><rect x="138" y="56" width="14" height="88" fill="#FF6A00"/><rect x="112" y="130" width="40" height="14" fill="#FF6A00"/></svg>`,
      '08-agent-human': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><polygon points="100,36 156,100 100,164 44,100" fill="none" stroke="#F1ECE0" stroke-width="6" stroke-dasharray="12 8" opacity="0.45"/><rect x="68" y="68" width="64" height="64" fill="#F1ECE0"/><rect x="68" y="68" width="64" height="64" fill="none" stroke="#FF6A00" stroke-width="4"/></svg>`,
      '09-seal-ticks': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="48" y="48" width="104" height="104" fill="#F1ECE0"/><rect x="48" y="48" width="28" height="8" fill="#FF6A00"/><rect x="48" y="48" width="8" height="28" fill="#FF6A00"/><rect x="124" y="48" width="28" height="8" fill="#FF6A00"/><rect x="144" y="48" width="8" height="28" fill="#FF6A00"/><rect x="48" y="144" width="28" height="8" fill="#FF6A00"/><rect x="48" y="124" width="8" height="28" fill="#FF6A00"/><rect x="124" y="144" width="28" height="8" fill="#FF6A00"/><rect x="144" y="124" width="8" height="28" fill="#FF6A00"/></svg>`,
      '10-stacked': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Docket"><rect width="200" height="200" fill="#1B1813"/><rect x="60" y="72" width="96" height="96" fill="#D9C9A8"/><rect x="44" y="56" width="96" height="96" fill="#F1ECE0"/><rect x="56" y="68" width="40" height="8" fill="#FF6A00"/></svg>`,
    };

    const variants = [
      { id: '01-bracket-mark', name: '01 - Bracket mark', desc: 'Kernel survey brackets scaled to the whole icon.' },
      { id: '02-three-marks', name: '02 - Three marks', desc: 'Agent diamond, human square, kernel brackets.' },
      { id: '03-docket-tab', name: '03 - Docket tab', desc: 'Filing tab silhouette only.' },
      { id: '04-human-gate', name: '04 - Human gate', desc: 'Empty record above an Ember bar.' },
      { id: '05-beacon-square', name: '05 - Beacon square', desc: 'OffGrid arc with a square where the beacon dot was.' },
      { id: '06-spine', name: '06 - Spine', desc: 'Ember spine and bone body.' },
      { id: '07-survey-frame', name: '07 - Survey frame', desc: 'Open brackets, empty center.' },
      { id: '08-agent-human', name: '08 - Agent to human', desc: 'Dashed diamond behind a solid square.' },
      { id: '09-seal-ticks', name: '09 - Seal ticks', desc: 'Bone package with Ember corner marks.' },
      { id: '10-stacked', name: '10 - Stacked', desc: 'Two cards, depth by tone only.' },
    ];

    function svg(id, size) {
      const wrap = document.createElement('div');
      wrap.innerHTML = icons[id];
      const el = wrap.firstChild;
      el.className = 'icon-' + size;
      return el;
    }

    const grid = document.getElementById('variants');
    const context = document.getElementById('context');

    variants.forEach(v => {
      const card = document.createElement('div');
      card.className = 'card';
      const h2 = document.createElement('h2');
      h2.textContent = v.name;
      const p = document.createElement('p');
      p.textContent = v.desc;
      const sizes = document.createElement('div');
      sizes.className = 'sizes';
      [128, 48, 24, 16].forEach(size => {
        const wrap = document.createElement('div');
        wrap.className = 'size-wrap';
        wrap.appendChild(svg(v.id, size));
        const label = document.createElement('span');
        label.className = 'size-label';
        label.textContent = String(size);
        wrap.appendChild(label);
        sizes.appendChild(wrap);
      });
      card.append(h2, p, sizes);
      grid.appendChild(card);

      const mock = document.createElement('div');
      mock.className = 'header-mock';
      mock.appendChild(svg(v.id, 24));
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = 'Docket';
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = 'ep-demo-a - EVALUATED';
      mock.append(title, meta);
      context.appendChild(mock);
    });
  </script>
</body>
</html>
